<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA — оценка качества диалогов</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Root container. In Dynamics 365 the same modules mount into a web resource div. -->
  <div id="cqa-app" class="cqa">
    <header class="cqa-top">
      <a class="brand" href="#/">CQA <span>Freedom Broker</span></a>
      <nav class="tabs" id="cqa-nav">
        <a href="#/" data-tab="dialogs">Диалоги</a>
        <a href="#/batch" data-tab="batch">Пакетная оценка</a>
        <a href="#/checklists" data-tab="checklists">Чек-листы</a>
        <a href="#/appeals" data-tab="appeals">Апелляции</a>
        <a href="#/validation" data-tab="validation">Валидация</a>
      </nav>
      <label class="group-pick">Набор
        <select id="cqa-group"></select>
      </label>
    </header>
    <main id="cqa-view" class="cqa-view" aria-live="polite"></main>
    <div id="cqa-toast" class="toast" role="status" hidden></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
